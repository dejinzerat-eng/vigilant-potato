# Lokální vývojové prostředí: PostgreSQL, Redis, Meilisearch, MinIO (S3)
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dejinzerat
      POSTGRES_PASSWORD: dejinzerat
      POSTGRES_DB: dejinzerat
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  meilisearch:
    image: getmeili/meilisearch:v1.12
    environment:
      MEILI_MASTER_KEY: devMasterKey123456
    ports: ["7700:7700"]
    volumes: [meili:/meili_data]
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]
volumes:
  pgdata:
  meili:
  minio:
